
name: "CodeQL Analysis"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
steps:
    - name: Checkout repository
      uses: actions/checkout@v2
- name: Initialize CodeQL
      uses: github/codeql-action/init@v2
- name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
- name: Create Pull Request for Issues
      uses: peter-evans/create-pull-request@v5
      with:
        branch: codeql/fix-issues
        commit-message: "CodeQL: Fix potential issues detected"
        title: "CodeQL Fix: Resolve detected issues"
        body: |
          This pull request was automatically created to resolve issues detected by CodeQL analysis.
